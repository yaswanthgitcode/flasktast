<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Login</h2>
        <form method="POST">
            <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
            <input id="password" class="form-control mb-1" type="password" name="password" placeholder="Password"
                required>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" onclick="togglePassword()">
                <label class="form-check-label">Show Password</label>
            </div>

            <script>
                function togglePassword() {
                    var x = document.getElementById("password");
                    x.type = (x.type === "password") ? "text" : "password";
                }
            </script>


            <button class="btn btn-success" type="submit">Login</button>
            <p class="mt-3">New user? <a href="/signup">Signup here</a></p>
        </form>
    </div>
</body>

</html>
