<!DOCTYPE html>
<html>
<head>
  <title>Faculty Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Faculty Dashboard</h2>
    <a href="/logout" class="btn btn-danger">Logout</a>
  </div>
  <h4>Students List</h4>
  <table class="table table-striped">
    <thead class="table-light">
      <tr><th>Image</th><th>Name</th><th>Email</th><th>Upload Marks</th></tr>
    </thead>
    <tbody>
      {% for student in students %}
      <tr>
        <td><img src="{{ student.image }}" width="60" class="rounded-circle" height="60"></td>
        <td>{{ student.name }}</td>
        <td>{{ student.email }}</td>
        <td>
          <form method="POST" action="/upload_marks">
            <input type="hidden" name="student_email" value="{{ student.email }}">
            <div class="input-group">
              <input type="text" name="subject" class="form-control" placeholder="Subject" required>
              <input type="number" name="marks" class="form-control" placeholder="Marks" required>
              <button class="btn btn-success">Upload</button>
            </div>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
